<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Survivor 50 — Draft Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --fire:#FF6B1A;--fire-light:#FF9950;--gold:#FFD700;--gold-dim:#B8860B;
  --bg:#0E0A07;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.08);
  --border:rgba(255,107,26,.18);--border-hi:rgba(255,107,26,.45);
  --text:#F0E6D3;--text-dim:rgba(240,230,211,.5);--text-muted:rgba(240,230,211,.28);
  --green:#4ADE80;--blue:#60A5FA;--red:#F87171;--silver:#C0C0C0;--bronze:#CD7F32;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(139,37,0,.22) 0%,transparent 70%),radial-gradient(ellipse 40% 28% at 8% 65%,rgba(255,107,26,.07) 0%,transparent 60%),radial-gradient(ellipse 40% 28% at 92% 35%,rgba(255,107,26,.06) 0%,transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0 14px 90px}

/* HEADER */
header{text-align:center;padding:32px 0 20px}
.torch{font-size:2.2rem;display:inline-block;animation:flicker 2.5s ease-in-out infinite alternate}
@keyframes flicker{0%{filter:drop-shadow(0 0 6px #FF6B1A);transform:scale(1) rotate(0deg)}40%{filter:drop-shadow(0 0 18px #FFD700);transform:scale(1.07) rotate(-1.5deg)}100%{filter:drop-shadow(0 0 10px #FF9950);transform:scale(.97) rotate(1deg)}}
h1{font-family:'Cinzel',serif;font-size:clamp(1.7rem,6vw,3.1rem);font-weight:900;color:var(--gold);text-shadow:0 0 40px rgba(255,107,26,.7),0 2px 4px rgba(0,0,0,.9);letter-spacing:.04em;line-height:1.1;margin-top:5px}
.subtitle{font-size:.75rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--fire-light);margin-top:5px;opacity:.8}
.ep-pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(139,37,0,.7),rgba(255,107,26,.35));border:1px solid var(--border-hi);color:var(--text);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-top:11px}
.ep-dot{width:6px;height:6px;background:var(--fire);border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.65)}}

/* STATUS BANNER */
.status-banner{background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,107,26,.07));border:1px solid rgba(255,215,0,.3);border-radius:var(--r);padding:11px 18px;margin:14px 0 22px;text-align:center;font-size:.8rem;font-weight:600;color:var(--gold);letter-spacing:.05em}
.status-banner span{opacity:.65;font-size:.73rem;font-weight:400;display:block;margin-top:3px;color:var(--text-dim)}

/* TABS */
.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px;margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:68px;background:transparent;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:9px 8px;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab-btn .ti{font-size:.95rem}
.tab-btn:hover{color:var(--text);background:var(--surface2)}
.tab-btn.active{background:linear-gradient(135deg,rgba(139,37,0,.85),rgba(255,107,26,.55));color:var(--gold)}
.tab-pane{display:none}.tab-pane.active{display:block}

/* SEC LABEL */
.sec-label{font-family:'Cinzel',serif;font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fire-light);margin-bottom:13px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(255,107,26,.3),transparent)}

/* LEADERBOARD */
.leader-list{display:flex;flex-direction:column;gap:9px}
.leader-card{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;transition:all .2s;position:relative;overflow:hidden}
.leader-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fire);opacity:0;transition:.2s}
.leader-card:hover::before{opacity:1}
.leader-card.r1{border-color:rgba(255,215,0,.35);background:rgba(255,215,0,.05)}
.leader-card.r2{border-color:rgba(192,192,192,.22)}
.leader-card.r3{border-color:rgba(205,127,50,.22)}
.rank-num{font-family:'Cinzel',serif;font-size:1.45rem;font-weight:900;text-align:center}
.r1 .rank-num{color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,.5)}
.r2 .rank-num{color:var(--silver)}
.r3 .rank-num{color:var(--bronze)}
.rank-num.lo{color:var(--text-muted);font-size:.95rem}
.leader-info{overflow:hidden}
.leader-name{font-weight:700;font-size:.98rem;color:var(--text)}
.picks-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.p-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:3px 9px 3px 4px;font-size:.7rem;font-weight:500;color:var(--text-dim)}
.p-chip.gone{opacity:.38;text-decoration:line-through;text-decoration-color:var(--fire)}
.p-chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:top;flex-shrink:0}
.av-sm{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:800;color:var(--gold);background:linear-gradient(135deg,rgba(255,107,26,.28),rgba(255,215,0,.14));border:1px solid rgba(255,215,0,.24);box-shadow:inset 0 0 12px rgba(255,215,0,.06);flex-shrink:0}
.score-col{text-align:right}
.score-num{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:900;color:var(--fire-light);line-height:1}
.score-lbl{font-size:.6rem;font-weight:600;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.leader-wrap{border-radius:var(--r)}
.leader-card{cursor:pointer}
.leader-name-btn{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:700;font-size:.98rem;color:var(--text);cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:6px}
.leader-name-btn:hover{color:var(--gold)}
.leader-card:hover .leader-name-btn{color:var(--gold)}
.leader-card:focus{outline:2px solid rgba(255,215,0,.45);outline-offset:3px}
.chev{font-size:.7rem;color:var(--fire-light);transition:transform .2s;display:inline-block}
.leader-wrap.open .chev{transform:rotate(90deg)}
.p-chip.active{border-color:rgba(74,222,128,.22);background:rgba(74,222,128,.07);color:rgba(240,230,211,.86)}
.p-chip.jury{border-color:rgba(255,215,0,.26);background:rgba(255,215,0,.08);color:var(--gold)}
.p-chip.gone{opacity:.42;text-decoration:line-through;text-decoration-color:var(--fire)}
.status-sym{font-size:.72rem;line-height:1;filter:drop-shadow(0 0 4px rgba(255,215,0,.18))}
.avatar-active{border-color:rgba(74,222,128,.38)!important;background:linear-gradient(135deg,rgba(74,222,128,.22),rgba(255,215,0,.10))!important;color:#D9FFE6!important}
.avatar-jury{border-color:rgba(255,107,26,.42)!important;background:linear-gradient(135deg,rgba(255,107,26,.24),rgba(255,215,0,.14))!important;color:var(--gold)!important}
.avatar-eliminated,.avatar-medevac{border-color:rgba(255,255,255,.10)!important;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(0,0,0,.16))!important;color:rgba(240,230,211,.55)!important}
.lb-detail{display:none;margin:-2px 0 4px 57px;background:rgba(0,0,0,.16);border:1px solid rgba(255,107,26,.13);border-radius:0 0 var(--r) var(--r);padding:10px 12px 12px}
.leader-wrap.open .lb-detail{display:block}
.lb-pick{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.lb-pick:last-child{border-bottom:0;padding-bottom:0}
.lb-pick-img{width:34px;height:34px;border-radius:8px;object-fit:cover;object-position:top;border:1px solid rgba(255,107,26,.18);background:rgba(255,107,26,.08)}
.lb-pick-name{font-weight:700;font-size:.84rem;color:var(--text);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lb-status-pill{font-size:.56rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:var(--text-dim)}
.lb-status-pill.active{color:var(--green);border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.08)}
.lb-status-pill.jury{color:var(--gold);border-color:rgba(255,215,0,.28);background:rgba(255,215,0,.08)}
.lb-breakdown{font-size:.68rem;color:var(--text-dim);margin-top:5px;line-height:1.55}
.lb-breakdown span{display:inline-block;margin-right:8px;white-space:nowrap}
.lb-pick-total{font-family:'Cinzel',serif;font-weight:900;color:var(--fire-light);font-size:1rem;white-space:nowrap}
.lb-empty{font-size:.68rem;color:var(--text-muted);font-style:italic}

/* SCORECARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}
.sc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.sc-head{background:rgba(255,107,26,.1);border-bottom:1px solid var(--border);padding:11px 15px;display:flex;justify-content:space-between;align-items:center}
.sc-name{font-family:'Cinzel',serif;font-size:.98rem;font-weight:700;color:var(--gold)}
.sc-total{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:var(--fire-light)}
.sc-picks{padding:9px 8px;display:flex;flex-direction:column;gap:5px}
.sc-row{display:grid;grid-template-columns:42px 1fr auto auto;align-items:center;gap:9px;padding:7px 8px;background:rgba(255,255,255,.03);border-radius:8px}
.sc-row.gone{opacity:.45}
.sc-row img,.av-sq{width:38px;height:38px;border-radius:8px;object-fit:cover;object-position:top;background:linear-gradient(135deg,rgba(255,107,26,.22),rgba(255,215,0,.12));border:1px solid rgba(255,215,0,.22);flex-shrink:0}
.av-sq{display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:800;color:var(--gold);box-shadow:inset 0 0 18px rgba(255,215,0,.05)}
.sc-pname{font-weight:600;font-size:.88rem;color:var(--text)}
.sc-pname.struck{text-decoration:line-through;text-decoration-color:var(--fire);color:var(--text-dim)}
.badge{font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.b-active{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.22)}
.b-eliminated{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.b-medevac{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.2)}
.b-jury{background:rgba(255,107,26,.1);color:var(--fire-light);border:1px solid rgba(255,107,26,.22)}
.b-winner{background:rgba(255,215,0,.13);color:var(--gold);border:1px solid rgba(255,215,0,.35)}
.sc-pts{font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;color:var(--fire-light);white-space:nowrap}

/* CAST */
.cast-section{margin-bottom:28px}
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
@media(max-width:380px){.cast-grid{grid-template-columns:repeat(3,1fr)}}
.cast-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:all .2s;position:relative}
.cast-card:hover{border-color:var(--border-hi);transform:translateY(-2px)}
.cast-card.gone{opacity:.32;filter:grayscale(.72)}
.cast-card.gone:hover{transform:none}
.cast-card.jury-member{border-color:rgba(255,215,0,.48);background:linear-gradient(180deg,rgba(255,215,0,.08),rgba(255,255,255,.035));filter:grayscale(.35);opacity:.82}
.cast-card.jury-member:hover{filter:grayscale(.1);opacity:1}
.c-img-wrap{position:relative;aspect-ratio:3/4;background:rgba(255,107,26,.07);overflow:hidden}
.c-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .3s}
.cast-card:not(.gone):not(.jury-member):hover .c-img-wrap img{transform:scale(1.05)}
.c-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(circle at 50% 35%,rgba(255,215,0,.18),transparent 38%),linear-gradient(160deg,rgba(255,107,26,.16),rgba(0,0,0,.28))}
.big-init{font-family:'Cinzel',serif;font-size:2.45rem;font-weight:900;color:var(--gold);opacity:.92;text-shadow:0 0 18px rgba(255,107,26,.55)}
.gone-banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22)}
.snuffed{background:rgba(139,37,0,.9);color:#FF9980;font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:5px;border:1px solid rgba(255,107,26,.5)}
.jury-banner{position:absolute;top:0;left:0;right:0;background:linear-gradient(135deg,rgba(255,215,0,.94),rgba(255,107,26,.9));color:#1f1204;font-size:.58rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:5px 4px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.tribe-dot{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;border:2px solid rgba(0,0,0,.6)}
.t-merged{background:var(--gold)}.t-cila{background:#FF6B1A}.t-kalo{background:#3B82F6}.t-vatu{background:#22C55E}
.c-info{padding:8px 8px 10px}
.c-name{font-weight:700;font-size:.76rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-drafter{font-size:.65rem;color:var(--fire-light);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-pts{font-family:'Cinzel',serif;font-size:.77rem;font-weight:700;color:var(--gold-dim);margin-top:2px}
.c-ep{font-size:.62rem;color:#555;margin-top:2px}
.c-jury{font-size:.65rem;color:var(--gold);margin-top:4px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ADVANTAGES PANEL */
.adv-panel{background:rgba(255,215,0,.04);border:1px solid rgba(255,215,0,.2);border-radius:var(--r);padding:16px;margin-bottom:22px}
.adv-title{font-family:'Cinzel',serif;font-size:.75rem;font-weight:700;letter-spacing:.15em;color:var(--gold);margin-bottom:12px;text-transform:uppercase}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.adv-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,215,0,.15);border-radius:8px;padding:9px 12px;font-size:.78rem}
.adv-holder{font-weight:700;color:var(--text);margin-bottom:2px}
.adv-type{color:var(--gold-dim);font-size:.7rem}
.adv-item.played{opacity:.4;border-color:rgba(255,255,255,.08)}
.adv-item.played .adv-type::after{content:' — PLAYED ✓';color:var(--green)}
.img-source-note{font-size:.68rem;color:var(--text-muted);text-align:center;margin:-12px 0 18px}

/* EPISODE LOG */
.ep-list{display:flex;flex-direction:column;gap:11px}
.ep-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.ep-card.latest{border-color:rgba(255,215,0,.3);box-shadow:0 0 20px rgba(255,107,26,.1)}
.ep-head{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid rgba(255,107,26,.1);background:rgba(255,107,26,.06);flex-wrap:wrap}
.ep-badge{background:linear-gradient(135deg,#8B2500,var(--fire));color:#fff;font-family:'Cinzel',serif;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.08em;white-space:nowrap}
.ep-badge.new{background:linear-gradient(135deg,#5B4000,#c8960d)}
.ep-ttl{font-weight:700;font-size:.92rem;flex:1}
.ep-dt{font-size:.7rem;color:var(--text-muted);white-space:nowrap}
.ep-evts{padding:11px 13px;display:flex;flex-wrap:wrap;gap:6px}
.ev{font-size:.7rem;font-weight:600;letter-spacing:.05em;padding:5px 10px;border-radius:6px;text-transform:uppercase}
.ev-boot{background:rgba(139,37,0,.22);color:#FF9980;border:1px solid rgba(139,37,0,.45)}
.ev-jury{background:rgba(255,107,26,.15);color:var(--fire-light);border:1px solid rgba(255,107,26,.3)}
.ev-medevac{background:rgba(96,165,250,.12);color:#93C5FD;border:1px solid rgba(96,165,250,.3)}
.ev-idol{background:rgba(255,215,0,.1);color:#FFE05C;border:1px solid rgba(255,215,0,.28)}
.ev-swap{background:rgba(74,222,128,.08);color:#86EFAC;border:1px solid rgba(74,222,128,.22)}
.ev-immunity{background:rgba(167,139,250,.1);color:#C4B5FD;border:1px solid rgba(167,139,250,.27)}
.ev-note{background:rgba(255,255,255,.04);color:var(--text-dim);border:1px solid rgba(255,255,255,.09)}
.ev-merge{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.3)}

/* SCORING KEY */
.key-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;max-width:600px;margin:0 auto}
.key-box h3{font-family:'Cinzel',serif;color:var(--gold);font-size:.95rem;text-align:center;margin-bottom:16px;letter-spacing:.1em}
.key-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:380px){.key-grid{grid-template-columns:1fr}}
.key-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 11px;background:rgba(255,255,255,.03);border-radius:7px;border-left:3px solid rgba(255,107,26,.38)}
.key-row span:first-child{font-size:.82rem}
.kpts{font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;color:var(--gold);white-space:nowrap}
.key-note{text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:13px;font-style:italic}
.divider{border:none;border-top:1px solid rgba(255,107,26,.11);margin:22px 0}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="torch">🔥</div>
  <h1>SURVIVOR 50</h1>
  <div class="subtitle">In the Hands of the Fans · Draft Tracker</div>
  <div class="ep-pill"><span class="ep-dot"></span>Finale · Episode 13 of 13 · May 20, 2026</div>
</header>

<div class="status-banner">
  🏆 FINALE COMPLETE — Aubry wins Survivor 50
  <span>Final 3: Aubry, Jonathan, Joe · Jury vote: Aubry 8, Jonathan 3, Joe 0 · Final jurors: Tiffany + Rizo</span>
</div>

<nav class="tabs">
  <button class="tab-btn active" onclick="tab('lb',this)"><span class="ti">🏆</span>Standings</button>
  <button class="tab-btn" onclick="tab('sc',this)"><span class="ti">📊</span>Picks</button>
  <button class="tab-btn" onclick="tab('cast',this)"><span class="ti">🌴</span>Cast</button>
  <button class="tab-btn" onclick="tab('eps',this)"><span class="ti">📺</span>Episodes</button>
  <button class="tab-btn" onclick="tab('rules',this)"><span class="ti">📋</span>Rules</button>
</nav>

<div id="pane-lb" class="tab-pane active"></div>
<div id="pane-sc" class="tab-pane"></div>
<div id="pane-cast" class="tab-pane"></div>
<div id="pane-eps" class="tab-pane"></div>
<div id="pane-rules" class="tab-pane"></div>

</div>
<script>
// ── SCORING ───────────────────────────────────────────────────
// Twist-balanced scoring. Advantages are scored through ADVANTAGE_EVENTS,
// so each advantage only needs to be maintained in one place.
const SC={
  preMergeSurvive:2, postMergeSurvive:3, jurySurvive:4,
  imm:5, groupImm:2, reward:3,
  findIdol:8, transferIdol:4, holdIdol:2, playIdol:12, idolPocket:-5,
  boomerangCreate:6, boomerangReceive:4, boomerangReturn:6, boomerangPlay:15,
  gainAdvantage:6, holdAdvantage:1, useAdvantage:8,
  bewareAccept:4, bewareComplete:12, bewareFail:-4,
  merge:10, jury:5, final5:10, final3:15, runnerUp:20, win:50,
  firstBoot:-5, fire:10, pairedElimPenalty:-2

// ── HELPERS ───────────────────────────────────────────────────
function survivalPts(eps){
  let total=0;
  for(let i=1;i<=eps;i++){
    if(i<6) total+=SC.preMergeSurvive;
    else if(i<8) total+=SC.postMergeSurvive;
    else total+=SC.jurySurvive;
  }
  return total;
}
function baseBonusPts(c){return c.bonuses.reduce((s,b)=>s+(BM[b]||0),0)}
function pts(c){return survivalPts(c.eps)+baseBonusPts(c)+advantagePtsFor(c.name)}
function pointBreakdown(c){return {survival:survivalPts(c.eps), base:baseBonusPts(c), advantages:advantagePtsFor(c.name), total:pts(c)}}
function bonusLabel(b){
  return ({
    first_boot:'First boot', imm:'Individual immunity', group_imm:'Group/pair immunity', reward:'Reward',
    merge:'Merge', jury:'Jury', final5:'Final 5', final3:'Final 3', runner_up:'Runner-up', winner:'Winner',
    fire:'Fire-making', idol_pocket:'Voted out with idol', paired_elim_penalty:'Paired elim penalty'
  })[b]||b.replaceAll('_',' ');
}
function pointDetails(c){
  const survival={label:'Survival ('+c.eps+' eps)', pts:survivalPts(c.eps)};
  const base=c.bonuses.map(b=>({label:bonusLabel(b), pts:BM[b]||0}));
  const adv=ADVANTAGE_EVENTS.filter(e=>e.player.toLowerCase()===c.name.toLowerCase()).map(e=>({label:e.label, pts:e.pts||0}));
  return [survival,...base,...adv];
}
function statusSymbol(status){return status==='winner'?'🏆':status==='runner_up'?'🥈':status==='finalist'?'🥉':status==='active'?'🟢':status==='jury'?'⚖️':status==='medevac'?'🏥':'🗳️'}
function statusLabel(c){
  if(!c) return 'Unknown';
  if(c.status==='winner') return 'Winner';
  if(c.status==='runner_up') return 'Runner-up';
  if(c.status==='finalist') return 'Finalist';
  if(c.status==='active') return 'Still in';
  if(c.status==='jury'){
    const juryOrder=CAST.filter(x=>x.status==='jury').sort((a,b)=>(a.epOut||99)-(b.epOut||99));
    const n=juryOrder.findIndex(j=>j.id===c.id)+1;
    return 'Juror #'+n;
  }
  if(c.status==='medevac') return 'Medevac';
  return 'Out Ep '+c.epOut;
}
function toggleLeaderDetails(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}
function toggleLeaderDetailsKey(e,id){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleLeaderDetails(id);}}
function drafterPts(d){
  let tot=0;
  const rows=d.picks.map(n=>{
    const m=CAST.find(c=>c.name.toLowerCase()===n.toLowerCase());
    const p=m?pts(m):0;tot+=p;
    return{name:n,pts:p,status:m?.status||'unknown',id:m?.id||null};
  });
  return{tot,rows};
}
function ini(name){return name.split(/[\s']+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)}
window.makeAv=(txt,cls,style)=>{const d=document.createElement('div');d.className=cls;d.style.cssText=`display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--fire);background:rgba(255,107,26,.1);${style}`;d.textContent=txt;return d;};

// ── LEADERBOARD ───────────────────────────────────────────────
function renderLB(){
  const sorted=DRAFTERS.map(d=>{const s=drafterPts(d);return{...d,tot:s.tot,rows:s.rows}}).sort((a,b)=>b.tot-a.tot);
  let h='<div class="leader-list">';
  sorted.forEach((s,i)=>{
    const r=i+1,rc=r<=3?`r${r}`:'',rn=r===1?'🥇':r===2?'🥈':r===3?'🥉':r,lo=r>3?' lo':'';
    const wrapId=`leader-${s.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}`;
    const chips=s.rows.map(p=>{
      const c=p.id?CAST.find(x=>x.id===p.id):null;
      const gone=['eliminated','medevac'].includes(p.status);
      const jury=p.status==='jury';
      const active=p.status==='active';
      const ph=`<div class="av-sm avatar-${p.status}">${ini(p.name)}</div>`;
      return `<div class="p-chip${gone?' gone':''}${jury?' jury':''}${active?' active':''}" title="${statusLabel(c)}">${ph}<span class="status-sym">${statusSymbol(p.status)}</span><span>${p.name}</span></div>`;
    }).join('');
    const detail=s.rows.map(p=>{
      const c=p.id?CAST.find(x=>x.id===p.id):null;
      if(!c) return '';
      const img=`<div class="av-sq avatar-${c.status}">${ini(p.name)}</div>`;
      const details=pointDetails(c).filter(d=>d.pts!==0);
      const detailHtml=details.length ? details.map(d=>`<span>${d.label}: <strong>${d.pts>0?'+':''}${d.pts}</strong></span>`).join('') : '<span class="lb-empty">No points yet</span>';
      return `<div class="lb-pick">${img}<div><div class="lb-pick-name"><span>${statusSymbol(c.status)}</span>${c.name}<span class="lb-status-pill ${c.status}">${statusLabel(c)}</span></div><div class="lb-breakdown">${detailHtml}</div></div><div class="lb-pick-total">${pts(c)}pt</div></div>`;
    }).join('');
    h+=`<div class="leader-wrap" id="${wrapId}"><div class="leader-card ${rc}" role="button" tabindex="0" aria-label="Expand ${s.name}'s draft breakdown" onclick="toggleLeaderDetails('${wrapId}')" onkeydown="toggleLeaderDetailsKey(event,'${wrapId}')"><div class="rank-num${lo}">${rn}</div><div class="leader-info"><button class="leader-name-btn" tabindex="-1" aria-hidden="true" type="button"><span class="chev">▶</span>${s.name}</button><div class="picks-row">${chips}</div></div><div class="score-col"><div class="score-num">${s.tot}</div><div class="score-lbl">pts</div></div></div><div class="lb-detail">${detail}</div></div>`;
  });
  document.getElementById('pane-lb').innerHTML=h+'</div>';
}

      const isJury=p.status==='jury';
      const isFinal=p.status==='winner'||p.status==='runner_up'||p.status==='finalist';
      const bc={active:'b-active',eliminated:'b-eliminated',medevac:'b-medevac',jury:'b-jury',winner:'b-winner',runner_up:'b-winner',finalist:'b-winner'}[p.status]||'b-active';
      const jurorNum=p.id?juryOrder.findIndex(j=>j.id===p.id)+1:0;
      const bl=p.status==='jury'?`Juror #${jurorNum}`:({active:'Active',eliminated:'Out',medevac:'Medevac',winner:'Winner!',runner_up:'Runner-up',finalist:'Finalist'}[p.status]||p.status);
      const ph=`<div class="av-sq avatar-${p.status}">${ini(p.name)}</div>`;
      return`<div class="sc-row${(gone||isJury)?' gone':''}">
        ${ph}<div class="sc-pname${(gone||isJury)?' struck':''}">${p.name}</div>
        <div class="badge ${bc}">${bl}</div><div class="sc-pts">${p.pts}pt</div>
      </div>`;
    }).join('');
    h+=`<div class="sc-card"><div class="sc-head"><span class="sc-name">${d.name}</span><span class="sc-total">${s.tot}pt</span></div><div class="sc-picks">${rows}</div></div>`;
  });
  document.getElementById('pane-sc').innerHTML=h+'</div>';
}

// ── CAST ──────────────────────────────────────────────────────
function renderCast(){
  const dl=;DRAFTERS.forEach(d=>d.picks.forEach(p=>dl[p.toLowerCase()]=d.name));
  const juryOrder=CAST.filter(c=>c.status==='jury').sort((a,b)=>(a.epOut||99)-(b.epOut||99));

  // Advantages panel
  const advHtml=ADVANTAGES.map(a=>`
    <div class="adv-item${a.played?' played':''}">
      <div class="adv-holder">${a.holder}</div>
      <div class="adv-type">${a.type}</div>
    </div>`).join('');

  const card=c=>{
    const gone=['eliminated','medevac'].includes(c.status);
    const isJury=c.status==='jury';
    const isFinal=c.status==='winner'||c.status==='runner_up'||c.status==='finalist';
    const p=pts(c),drafter=dl[c.name.toLowerCase()]||null;
    const jurorNum=isJury?juryOrder.findIndex(j=>j.id===c.id)+1:0;
    const imgInner=`<div class="c-placeholder avatar-${c.status}"><div class="big-init">${ini(c.name)}</div></div>`;
    const dotClass=c.tribe==='merged'?'t-merged':`t-${c.tribe}`;
    let banner='';
    if(c.status==='winner') banner=`<div class="jury-banner">🏆 Winner</div>`;
    else if(c.status==='runner_up') banner=`<div class="jury-banner">🥈 Runner-up</div>`;
    else if(c.status==='finalist') banner=`<div class="jury-banner">🥉 Finalist</div>`;
    else if(isJury) banner=`<div class="jury-banner">⚖️ Juror #${jurorNum}</div>`;
    else if(gone) banner=`<div class="gone-banner"><span class="snuffed">${c.elimType==='medevac'?'🏥 Medevac':'🗳️ Out'}</span></div>`;
    const cardClass=`cast-card${gone?' gone':''}${isJury?' jury-member':''}${isFinal?' jury-member':''}`;
    return`<div class="${cardClass}">
      <div class="c-img-wrap">${imgInner}<div class="tribe-dot ${dotClass}"></div>${banner}</div>
      <div class="c-info">
        <div class="c-name">${c.name}</div>
        ${drafter?`<div class="c-drafter">📌 ${drafter}</div>`:`<div class="c-drafter" style="color:#3a3a3a">Undrafted</div>`}
        ${(gone&&!isJury)?`<div class="c-ep">Ep${c.epOut}·${c.elimType==='medevac'?'Medevac':'Out'}</div>`:
          isJury?`<div class="c-jury">Juror #${jurorNum} · Ep${c.epOut} · ${p}pts</div>`:
          isFinal?`<div class="c-jury">${statusLabel(c)} · ${p}pts</div>`:
          `<div class="c-pts">${p}pts</div>`}
      </div>
    </div>`;
  };

  const active=CAST.filter(c=>c.status==='active');
  const finalists=CAST.filter(c=>['winner','runner_up','finalist'].includes(c.status));
  const jury=CAST.filter(c=>c.status==='jury');
  const elim=CAST.filter(c=>['eliminated','medevac'].includes(c.status));

  document.getElementById('pane-cast').innerHTML=`
    <div class="adv-panel">
      <div class="adv-title">🗺️ Active Advantages & Idols</div>
      <div class="adv-grid">${advHtml}</div>
    </div>
    <div class="cast-section"><div class="sec-label">Final Results (${finalists.length})</div><div class="cast-grid">${finalists.map(card).join('')}</div></div>
    <div class="divider"></div>
    <div class="cast-section"><div class="sec-label">Jury (${jury.length})</div><div class="cast-grid">${jury.map(card).join('')}</div></div>
    <div class="divider"></div>
    <div class="cast-section"><div class="sec-label">Snuffed — Pre-Jury (${elim.length})</div><div class="cast-grid">${elim.map(card).join('')}</div></div>`;
}

// ── EPISODES ─────────────────────────────────────────────────
function renderEps(){
  const tm={boot:'ev-boot',jury:'ev-jury',medevac:'ev-medevac',idol:'ev-idol',swap:'ev-swap',immunity:'ev-immunity',note:'ev-note',merge:'ev-merge'};
  const h=[...EPISODES].reverse().map(ep=>`
    <div class="ep-card${ep.latest?' latest':''}">
      <div class="ep-head"><span class="ep-badge${ep.latest?' new':''}">${ep.latest?'★ ':''}Ep ${ep.num}</span><span class="ep-ttl">"${ep.title}"</span><span class="ep-dt">${ep.date}</span></div>
      <div class="ep-evts">${ep.events.map(e=>`<span class="ev ${tm[e.t]||'ev-note'}">${e.x}</span>`).join('')}</div>
    </div>`).join('');
  document.getElementById('pane-eps').innerHTML=`<div class="ep-list">${h}</div>`;
}

// ── RULES ─────────────────────────────────────────────────────
function renderRules(){
  const rows=[
    ["Survive episode — pre-merge","+2"],["Survive episode — post-merge","+3"],["Survive episode — jury phase","+4"],
    ["Win Individual Immunity","+5"],["Win Group / Pair Immunity","+2"],["Win Reward Challenge","+3"],
    ["Make the Merge","+10"],["Make Jury","+5"],
    ["Find Idol","+8"],["Transfer Idol","+4"],["Hold Idol per episode","+2"],["Play Idol Successfully","+12"],["Voted out w/ idol","−5"],
    ["Create Boomerang Idol","+6"],["Receive Boomerang Idol","+4"],["Boomerang returns / converts","+6"],["Play Boomerang Idol","+15"],
    ["Gain Advantage","+6"],["Hold Advantage per episode","+1"],["Use Advantage Successfully","+8"],
    ["Accept Beware Advantage","+4"],["Complete / Convert Beware Advantage","+12"],["Fail Beware Advantage","−4"],
    ["Make Final 5","+10"],["Make Final 3","+15"],["Runner-Up","+20"],["WIN SURVIVOR! 🏆","+50"],
    ["First Boot penalty","−5"],["Medical evacuation","0"],["Win Fire-Making Challenge","+10"],["Paired elimination penalty","−2"]
  ];
  document.getElementById('pane-rules').innerHTML=`<div class="key-box"><h3>🏝️ DRAFT POINT SYSTEM · TWIST BALANCED</h3><div class="key-grid">${rows.map(([l,p])=>`<div class="key-row"><span>${l}</span><span class="kpts">${p}</span></div>`).join('')}</div><p class="key-note">Advantage points are generated from one structured advantage log, so Rick’s MrBeast Beware Advantage, Genevieve’s 2 idol finds/transfers, Boomerang Idols, holds, and plays stay consistent without manual bonus duplication.</p></div>`;
}

// ── TABS// ── TABS ──────────────────────────────────────────────────────
function tab(name,btn){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pane-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── INIT ──────────────────────────────────────────────────────
(()=>{
  renderLB();renderSC();renderCast();renderEps();renderRules();
})();
</script>
</body>
</html>
